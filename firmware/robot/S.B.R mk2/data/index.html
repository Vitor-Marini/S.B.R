<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>S.B.R mk2 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:10px;max-width:800px;margin:0 auto;overflow-x:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
h2{text-align:center;margin-bottom:10px;color:#0af;font-size:18px}
#status{padding:6px 10px;border-radius:4px;margin-bottom:8px;font-weight:bold;text-align:center;font-size:13px}
.state-init,.state-idle,.state-calibrate{background:#333;color:#ccc}
.state-starting{background:#ff8c00;color:#000}
.state-active{background:#00aa44;color:#fff}
.state-moving{background:#0066ff;color:#fff}
.state-fault{background:#cc0033;color:#fff}

.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.card{background:#1a1a2e;border-radius:6px;padding:6px 8px;flex:1;min-width:60px;text-align:center}
.card label{color:#888;font-size:10px;display:block}
.card .val{font-size:16px;font-weight:bold;color:#0af}

canvas{background:#1a1a2e;border-radius:6px;width:100%!important;height:140px!important;margin-bottom:8px}

.btn-row{display:flex;gap:6px;margin:8px 0}
.btn-row button{padding:8px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;flex:1;font-size:13px}
.btn-start{background:#00aa44;color:#fff}
.btn-stop{background:#cc0033;color:#fff}
.btn-cal{background:#ff8c00;color:#000}

/* Joystick */
.joystick-wrap{position:relative;background:#1a1a2e;border-radius:12px;width:100%;aspect-ratio:1;max-width:260px;margin:8px auto;border:2px solid #333;touch-action:none}
.joystick-base{position:absolute;left:50%;top:50%;width:90%;height:90%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#222,#1a1a2e);border:1px solid #333}
.joystick-knob{position:absolute;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#0af,#0066cc);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px rgba(0,170,255,.3);cursor:pointer;transition:box-shadow .1s;touch-action:none;z-index:2}
.joystick-knob.active{box-shadow:0 0 30px rgba(0,170,255,.6)}
.joystick-labels{position:absolute;width:100%;height:100%;pointer-events:none;font-size:11px;color:#555}
.joystick-labels span{position:absolute}
.joystick-labels .f{top:6px;left:50%;transform:translateX(-50%)}
.joystick-labels .b{bottom:6px;left:50%;transform:translateX(-50%)}
.joystick-labels .l{left:6px;top:50%;transform:translateY(-50%)}
.joystick-labels .r{right:6px;top:50%;transform:translateY(-50%)}
.joystick-coords{text-align:center;font-size:12px;color:#888;margin:4px 0 8px}

.slider-group{margin:5px 0}
.slider-group label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:1px;color:#aaa}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#333;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#0af;cursor:pointer}

.btn-csv{margin-top:6px;padding:6px;background:#0af;color:#000;border:none;border-radius:4px;cursor:pointer;width:100%;font-size:12px}
@media(min-width:500px){.joystick-wrap{max-width:220px}}
</style>
</head>
<body>

<h2>S.B.R mk2 — Controle</h2>
<div id="status" class="state-init">Conectando...</div>

<div class="row">
  <div class="card"><label>Pitch</label><div class="val" id="valAngle">0.0</div></div>
  <div class="card"><label>Vel</label><div class="val" id="valVel">0.00</div></div>
  <div class="card"><label>Alvo V</label><div class="val" id="valVTarget">0.00</div></div>
  <div class="card"><label>Alvo T</label><div class="val" id="valTTarget">0</div></div>
  <div class="card"><label>Output</label><div class="val" id="valOutput">0</div></div>
</div>

<canvas id="angleChart"></canvas>

<div class="btn-row">
  <button class="btn-start" onclick="sendCmd({start:1})">INICIAR</button>
  <button class="btn-stop" onclick="sendCmd({stop:1})">PARAR</button>
  <button class="btn-cal" onclick="sendCmd({calibrate:1})">CALIBRAR</button>
</div>

<div class="joystick-wrap" id="joystickArea">
  <div class="joystick-base"></div>
  <div class="joystick-labels">
    <span class="f">▲ Frente</span>
    <span class="b">▼ Trás</span>
    <span class="l">◀ Esq</span>
    <span class="r">Dir ▶</span>
  </div>
  <div class="joystick-knob" id="joystickKnob"></div>
</div>
<div class="joystick-coords" id="joyCoords">V: 0.00 | T: 0°</div>

<div class="slider-group">
  <label>Kp <span id="kpVal">25.0</span></label>
  <input type="range" id="kp" min="0" max="200" step="0.5" value="25">
</div>
<div class="slider-group">
  <label>Ki <span id="kiVal">0.50</span></label>
  <input type="range" id="ki" min="0" max="10" step="0.05" value="0.5">
</div>
<div class="slider-group">
  <label>Kd <span id="kdVal">0.80</span></label>
  <input type="range" id="kd" min="0" max="5" step="0.05" value="0.8">
</div>
<div class="slider-group">
  <label>Setpoint <span id="spVal">0.0</span></label>
  <input type="range" id="setpoint" min="-10" max="10" step="0.5" value="0">
</div>

<button class="btn-csv" onclick="downloadCSV()">Exportar CSV</button>

<script>
const ws = new WebSocket(`ws://${location.hostname}/ws`);
const statusEl = document.getElementById('status');

const ctx = document.getElementById('angleChart').getContext('2d');
const angleData=[], timeData=[];
const chart = new Chart(ctx,{
  type:'line',
  data:{
    labels:timeData,
    datasets:[{label:'Pitch',data:angleData,borderColor:'#0af',borderWidth:2,tension:0.3,pointRadius:0}]
  },
  options:{
    animation:false,responsive:true,maintainAspectRatio:false,
    scales:{
      x:{display:false},
      y:{min:-45,max:45,grid:{color:'#333'}}
    },
    plugins:{legend:{labels:{color:'#eee',boxWidth:12}}}
  }
});

ws.onopen=()=>{
  statusEl.textContent='Conectado';
  statusEl.className='state-active';
};
ws.onclose=()=>{
  statusEl.textContent='Desconectado';
  statusEl.className='state-fault';
};
ws.onmessage=(ev)=>{
  const d=JSON.parse(ev.data);
  if('angle' in d){
    timeData.push(new Date().toLocaleTimeString());
    angleData.push(d.angle);
    if(timeData.length>80){timeData.shift();angleData.shift()}
    chart.update();
    document.getElementById('valAngle').textContent=d.angle.toFixed(1);
    document.getElementById('valVel').textContent=(d.vel||0).toFixed(2);
    document.getElementById('valVTarget').textContent=(d.vtarget||0).toFixed(2);
    document.getElementById('valTTarget').textContent=(d.ttarget||0).toFixed(0);
    document.getElementById('valOutput').textContent=(d.output||0).toFixed(0);
  }
  if('state' in d){
    statusEl.textContent='Estado: '+d.state;
    statusEl.className='state-'+d.state.toLowerCase();
  }
  if('kp' in d){document.getElementById('kp').value=d.kp;document.getElementById('kpVal').textContent=d.kp}
  if('ki' in d){document.getElementById('ki').value=d.ki;document.getElementById('kiVal').textContent=d.ki.toFixed(2)}
  if('kd' in d){document.getElementById('kd').value=d.kd;document.getElementById('kdVal').textContent=d.kd.toFixed(2)}
  if('setpoint' in d){document.getElementById('setpoint').value=d.setpoint;document.getElementById('spVal').textContent=d.setpoint.toFixed(1)}
};

// Joystick
const knob=document.getElementById('joystickKnob');
const area=document.getElementById('joystickArea');
let jx=0,jy=0,active=false;

function getPos(e){
  const r=area.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-cx,y:t.clientY-cy,radius:Math.min(r.width,r.height)/2*0.85};
}

function updateKnob(px,py,radius){
  const d=Math.sqrt(px*px+py*py);
  const clamp=d>radius?radius/d:1;
  jx=px*clamp/radius;
  jy=py*clamp/radius;
  if(d>radius){px*=radius/d;py*=radius/d}
  knob.style.transform=`translate(calc(-50% + ${px}px),calc(-50% + ${py}px))`;
  knob.classList.add('active');
  document.getElementById('joyCoords').textContent=`V: ${(-jy).toFixed(2)} | T: ${(jx*180).toFixed(0)}°`;
  // jy is inverted: up = negative Y = forward = positive velocity
  ws.send(JSON.stringify({v:-jy*1.0,turn:jx*180}));
}

function onStart(e){e.preventDefault();active=true;const p=getPos(e);updateKnob(p.x,p.y,p.radius)}
function onMove(e){if(!active)return;e.preventDefault();const p=getPos(e);updateKnob(p.x,p.y,p.radius)}
function onEnd(e){
  if(!active)return;
  active=false;jx=0;jy=0;
  knob.style.transform='translate(-50%,-50%)';
  knob.classList.remove('active');
  document.getElementById('joyCoords').textContent='V: 0.00 | T: 0°';
  ws.send(JSON.stringify({v:0,turn:0}));
}

area.addEventListener('touchstart',onStart,{passive:false});
area.addEventListener('touchmove',onMove,{passive:false});
area.addEventListener('touchend',onEnd);
area.addEventListener('touchcancel',onEnd);
area.addEventListener('mousedown',onStart);
document.addEventListener('mousemove',onMove);
document.addEventListener('mouseup',onEnd);

// PID sliders
['kp','ki','kd','setpoint'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{
    const val=parseFloat(el.value);
    document.getElementById(id+'Val').textContent=val.toFixed(2);
    const o={};o[id]=val;ws.send(JSON.stringify(o));
  });
});

function sendCmd(o){ws.send(JSON.stringify(o))}
function downloadCSV(){
  let csv='timestamp,angle\n';
  for(let i=0;i<timeData.length;i++)csv+=`${timeData[i]},${angleData[i]}\n`;
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='sbr_log.csv';
  a.click();
}
</script>
</body>
</html>
